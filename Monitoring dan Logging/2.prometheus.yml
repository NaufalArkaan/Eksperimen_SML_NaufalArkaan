# Prometheus Configuration for Bank Marketing Model Serving Monitoring
# Project: Dicoding Final Project - Sistem Machine Learning MLOps (Milestone 11 - Prometheus)

global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: 'bank_marketing_model_exporter'
    scrape_interval: 2s
    static_configs:
      - targets: ['127.0.0.1:8001']
        labels:
          environment: 'production'
          service: 'bank-marketing-ml'
